name: gh_pages_update

on:
  push:
    branches:
      - french-release

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; ne pas annuler un déploiement en cours.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build book with mdBook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdbook
        run: |
          mkdir bin
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.14/mdbook-v0.4.14-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz --directory=bin
          echo "$(pwd)/bin" >> "${GITHUB_PATH}"

      - name: Build
        run: mdbook build FRENCH

      - name: Inject PWA tags into HTML head
        run: |
          BASE_PATH="/${GITHUB_REPOSITORY#*/}"
          find FRENCH/book -name "*.html" -exec sed -i \
            "s|</head>|<link rel=\"manifest\" href=\"${BASE_PATH}/manifest.json\"><meta name=\"theme-color\" content=\"#CE422B\"><link rel=\"apple-touch-icon\" href=\"${BASE_PATH}/icon-192.png\"></head>|" \
            {} \;

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: FRENCH/book

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
